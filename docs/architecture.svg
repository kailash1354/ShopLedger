<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, routes, library modules, configuration, JSON datastore, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 13px Arial,sans-serif;fill:#475569}
      .head{font:700 15px Arial,sans-serif;fill:#0f172a}.label{font:600 13px Arial,sans-serif;fill:#0f172a}.small{font:400 12px Arial,sans-serif;fill:#334155}
      .tiny{font:400 12px Arial,sans-serif;fill:#475569}.box{stroke:#94a3b8;stroke-width:1.5;rx:10}.route{fill:#eff6ff;stroke:#60a5fa}.lib{fill:#f8fafc;stroke:#94a3b8}.data{fill:#fff7ed;stroke:#fb923c}.config{fill:#f5f3ff;stroke:#a78bfa}.highlight{fill:#fef2f2;stroke:#ef4444;stroke-width:2.5}.flow{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#flowArrow)}.edge{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}.num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font:700 12px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="38" class="title">ShopLedger architecture</text>
  <text x="40" y="61" class="subtitle">Node/Express POS, Khata credit ledger, GST pricing and printable invoice flow</text>

  <!-- Browser -->
  <rect x="40" y="95" width="220" height="145" class="box" fill="#ecfeff"/>
  <text x="58" y="121" class="head">Browser UI</text>
  <text x="58" y="144" class="label">public/</text>
  <text x="58" y="164" class="small">index.html</text>
  <text x="58" y="182" class="small">js/app.js</text>
  <text x="58" y="200" class="small">css/style.css</text>
  <text x="58" y="222" class="tiny">POS cart, preview, orders, invoice link</text>

  <!-- Server -->
  <rect x="315" y="95" width="220" height="145" class="box" fill="#e0f2fe"/>
  <text x="333" y="121" class="head">Express application</text>
  <text x="333" y="148" class="label">server.js</text>
  <text x="333" y="168" class="small">bodyParser.json()</text>
  <text x="333" y="186" class="small">express.static(public)</text>
  <text x="333" y="204" class="small">mounts /api routers</text>
  <text x="333" y="222" class="small">GET /orders/:id/invoice</text>

  <path d="M260 168 H315" class="edge"/>

  <!-- Routes -->
  <rect x="590" y="82" width="250" height="275" class="box" fill="#f0f9ff"/>
  <text x="610" y="108" class="head">routes/  (mounted under /api)</text>
  <rect x="610" y="123" width="210" height="48" class="box route"/>
  <text x="625" y="143" class="label">orders.js</text><text x="625" y="160" class="tiny">GET/POST orders, cancel</text>
  <rect x="610" y="180" width="210" height="38" class="box route"/>
  <text x="625" y="204" class="label">products.js</text>
  <rect x="610" y="227" width="210" height="38" class="box route"/>
  <text x="625" y="251" class="label">customers.js</text>
  <rect x="610" y="274" width="210" height="48" class="box route"/>
  <text x="625" y="294" class="label">reports.js</text><text x="625" y="311" class="tiny">pricing preview, dashboard, export</text>
  <path d="M535 168 H590" class="edge"/>

  <!-- Libs -->
  <rect x="40" y="300" width="500" height="330" class="box" fill="#f8fafc"/>
  <text x="60" y="326" class="head">lib/  business modules</text>
  <rect x="60" y="342" width="140" height="54" class="box lib"/><text x="74" y="365" class="label">pricing.js</text><text x="74" y="383" class="tiny">subtotal, computeTotals</text>
  <rect x="215" y="342" width="140" height="54" class="box highlight"/><text x="229" y="365" class="label">invoice.js</text><text x="229" y="383" class="tiny">render, computeInvoiceFigures</text>
  <rect x="370" y="342" width="140" height="54" class="box highlight"/><text x="384" y="365" class="label">tax.js</text><text x="384" y="383" class="tiny">getRateForItem, splitCgstSgst</text>
  <rect x="60" y="415" width="140" height="54" class="box lib"/><text x="74" y="438" class="label">coupons.js</text><text x="74" y="456" class="tiny">validate, calculateDiscount</text>
  <rect x="215" y="415" width="140" height="54" class="box lib"/><text x="229" y="438" class="label">inventory.js</text><text x="229" y="456" class="tiny">find, check, reserve</text>
  <rect x="370" y="415" width="140" height="54" class="box lib"/><text x="384" y="438" class="label">ledger.js</text><text x="384" y="456" class="tiny">Khata charge/settlement</text>
  <rect x="60" y="488" width="140" height="54" class="box lib"/><text x="74" y="511" class="label">orders.js</text><text x="74" y="529" class="tiny">add, get, cancel, list</text>
  <rect x="215" y="488" width="140" height="54" class="box lib"/><text x="229" y="511" class="label">store.js</text><text x="229" y="529" class="tiny">read, write, appendAudit</text>
  <rect x="370" y="488" width="140" height="54" class="box lib"/><text x="384" y="511" class="label">reports.js</text><text x="384" y="529" class="tiny">dashboard, reconciliation</text>
  <rect x="60" y="561" width="140" height="54" class="box lib"/><text x="74" y="584" class="label">dates.js</text><text x="74" y="602" class="tiny">today, date keys</text>
  <text x="215" y="590" class="tiny">Shared CommonJS modules</text>

  <!-- Config/data -->
  <rect x="900" y="95" width="250" height="125" class="box config"/>
  <text x="920" y="122" class="head">config.js</text>
  <text x="920" y="146" class="small">shop identity + GSTIN</text>
  <text x="920" y="165" class="small">tax.hsnSlabs + defaultRate</text>
  <text x="920" y="184" class="small">coupons + inventory defaults</text>
  <text x="920" y="203" class="small">port + adminKey</text>
  <rect x="900" y="255" width="250" height="145" class="box data"/>
  <text x="920" y="282" class="head">data/db.json</text>
  <text x="920" y="306" class="small">products</text><text x="920" y="325" class="small">customers + settlements</text>
  <text x="920" y="344" class="small">orders + nextOrderId</text><text x="920" y="363" class="small">auditLog + nextSettlementId</text>
  <text x="920" y="385" class="tiny">read/write JSON persistence</text>

  <!-- structural edges -->
  <path d="M715 357 V470 H540" class="edge dashed"/>
  <path d="M840 220 H900" class="edge dashed"/>
  <path d="M840 310 H900" class="edge dashed"/>
  <path d="M355 520 H900" class="edge dashed"/>
  <path d="M440 369 V415" class="edge dashed"/>
  <path d="M200 369 H370" class="edge dashed"/>

  <!-- Order flow -->
  <rect x="565" y="440" width="585" height="250" class="box" fill="#eff6ff"/>
  <text x="585" y="468" class="head">Numbered flow: placing an order</text>
  <circle cx="594" cy="495" r="12" class="num"/><text x="594" y="495" class="numtext">1</text><text x="615" y="500" class="small">public/js/app.js → POST /api/orders</text>
  <circle cx="594" cy="530" r="12" class="num"/><text x="594" y="530" class="numtext">2</text><text x="615" y="535" class="small">routes/orders.js reads store and resolves products</text>
  <circle cx="594" cy="565" r="12" class="num"/><text x="594" y="565" class="numtext">3</text><text x="615" y="570" class="small">inventory.check → pricing.computeTotals</text>
  <circle cx="594" cy="600" r="12" class="num"/><text x="594" y="600" class="numtext">4</text><text x="615" y="605" class="small">coupons.validate; tax.getRateForItem; Khata if selected</text>
  <circle cx="594" cy="635" r="12" class="num"/><text x="594" y="635" class="numtext">5</text><text x="615" y="640" class="small">inventory.reserve → orders.add → appendAudit</text>
  <circle cx="594" cy="670" r="12" class="num"/><text x="594" y="670" class="numtext">6</text><text x="615" y="675" class="small">store.write saves db.json; HTTP 201 returns order</text>

  <!-- highlighted invoice path -->
  <path d="M535 205 C560 205 560 369 585 369" class="flow"/>
  <path d="M355 369 H370" class="flow"/>
  <path d="M715 220 C870 220 870 225 900 225" class="edge dashed"/>
  <text x="760" y="212" class="tiny">invoice route loads order</text>
  <text x="720" y="382" class="tiny" fill="#b91c1c">highlighted ticket path: printable invoice</text>

  <!-- Legend -->
  <rect x="40" y="715" width="1110" height="55" class="box" fill="#ffffff"/>
  <text x="60" y="738" class="head">Legend</text>
  <rect x="135" y="726" width="18" height="18" class="box lib"/><text x="162" y="740" class="small">module</text>
  <rect x="240" y="726" width="18" height="18" class="box route"/><text x="267" y="740" class="small">router</text>
  <rect x="345" y="726" width="18" height="18" class="box config"/><text x="372" y="740" class="small">configuration</text>
  <rect x="490" y="726" width="18" height="18" class="box data"/><text x="517" y="740" class="small">persistent JSON data</text>
  <rect x="665" y="726" width="18" height="18" class="box highlight"/><text x="692" y="740" class="small">ticket focus: invoice.js / tax.js</text>
  <line x1="935" y1="735" x2="985" y2="735" class="flow"/><text x="995" y="740" class="small">order flow / dependency</text>
</svg>
